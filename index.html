:#6d86ba}.sv-pb{fill:#c7787e}.sv-t{font:600 12px Inter,sans-serif;fill:#26344e}.sv-m{font:10px Inter,sans-serif;fill:#6c7890}.sv-l{stroke:#8490a6;stroke-width:1.5;fill:none}.sv-ar{fill:#8490a6}.sv-ax{stroke:#a7adbe;stroke-width:1.2}.sv-c1{stroke:#618bce;stroke-width:2.6}.sv-c2{stroke:#c07f8e;stroke-width:2.6}.sv-bad{fill:#b95462}.sv-acc{fill:#3d8d74}.sv-hl{fill:none;stroke:#82b7a1;stroke-width:1.1}.sv-hl2{fill:none;stroke:#acc0ec;stroke-width:1.1}.sv-gl{stroke:#5eaf85}.sv-badl{stroke:#be6170}.note{border-right:4px solid var(--pur);background:#f1edf9;padding:14px 17px;border-radius:12px}.warning{border-right:4px solid #d49c4d;background:#fff8ec;padding:13px 17px;border-radius:12px}.goodbox{border-right:4px solid var(--good);background:#ecf9f3;padding:13px 17px;border-radius:12px}.mapgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.mapnode{background:white;border:1px solid #ddd9eb;border-top:4px solid #8d7cc4;border-radius:15px;padding:13px;text-align:right}.mapnode:hover{background:#f4f0fe}.mapnode small{display:block;color:var(--muted);font:600 11px Inter,sans-serif;direction:ltr;text-align:left}.formsel,.inp{width:100%;background:#fff;border:1px solid #dce0ee;color:var(--ink);border-radius:11px;padding:10px 12px;min-width:0}.opt{display:flex;gap:11px;align-items:flex-start;width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:15px;text-align:left;direction:ltr;margin:9px 0;line-height:1.6;font-family:Inter,Arial,sans-serif}.opt span{flex:1}.opt.selected{border-color:#8b7bc3;background:#f3effe}.opt.correct{border-color:#50a480;background:#effaf4}.opt.wrong{border-color:#d1777a;background:#fff0f0}.letter{display:grid;place-items:center;min-width:26px;height:26px;border-radius:8px;background:#eff0f7;color:#6d5cab;font:700 12px Inter}.question{font:600 16px/1.8 Inter,Arial,sans-serif;direction:ltr;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere}.glossgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.flip{border:1px solid var(--line);border-radius:16px;padding:17px;background:white;min-height:154px;text-align:right;cursor:pointer}.flip .english{font:700 15px/1.6 Inter,sans-serif;color:#6a59ad;direction:ltr;text-align:left;display:block}.flip .translation{font-weight:600;margin-top:6px}.flip .def{font-size:13px;margin-top:10px;background:#f6f4fb;padding:12px;border-radius:12px}.labcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.sliderrow{display:flex;align-items:center;gap:12px;margin:12px 0}.sliderrow label{min-width:85px}.sliderrow input{flex:1;min-width:60px;accent-color:var(--pur)}.kpi{background:#f0eff9;border-radius:13px;padding:13px;text-align:center}.kpi b{font:700 23px Inter,sans-serif;display:block;color:var(--navy)}.decision{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.decision .card{padding:16px}.stepnum{width:34px;height:34px;border-radius:12px;background:var(--purple);color:var(--pur);display:inline-grid;place-items:center;font:800 13px Inter}.count{font-family:Inter,sans-serif;font-weight:800;font-size:25px}.foot{margin-top:35px;text-align:center;color:var(--muted);font-size:12px}.hidden{display:none!important}.tag{font-size:11px;font-weight:700;color:#6352a4;background:#f2effb;padding:4px 9px;border-radius:9px;display:inline-flex}.tag.warn{background:#fff3df;color:#946426}.cardlink{border:0;background:none;text-align:right;padding:0;color:var(--pur);font-weight:700}.lab-result{font:700 28px Inter,sans-serif;color:var(--pur)}.outline{border:1px solid #dedbe9;border-radius:14px;padding:14px}.label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:#52617b}.choicegroup{display:grid;gap:8px}

<script>
var D=[
{id:'d1',n:'D1',w:17.3,en:'Data, ML Foundations & Model Evaluation',ar:'أسس البيانات وتعلم الآلة وتقييم النماذج',L:[
 {t:['Data quality, cleaning & features','جودة البيانات وتنظيفها والخصائص'],p:[
  ['Data types: structured (tables), unstructured (text, images), time-series. Bad data gives bad models, so quality comes first.','أنواع البيانات: منظمة (جداول) وغير منظمة (نص وصور) وسلاسل زمنية. البيانات السيئة تعطي نموذجًا سيئًا، فالجودة أولًا.'],
  ['Missing values: drop rows if few, or impute (mean for symmetric data, median for skewed data, or a model).','القيم المفقودة: احذفي الصفوف إن كانت قليلة، أو عوّضيها (المتوسط للبيانات المتماثلة، الوسيط للمنحرفة، أو بنموذج).'],
  ['Outliers: detect with IQR or z-score. Do not delete blindly: in fraud detection the outlier is the signal.','القيم الشاذة: تُكتشف بـ IQR أو z-score. لا تحذفيها بشكل أعمى، ففي كشف الاحتيال الشاذ هو المطلوب.'],
  ['Feature engineering: scaling, one-hot encoding, log transforms, new combined features. Feature selection removes noisy or redundant features.','هندسة الخصائص: تحجيم وترميز one-hot وتحويل لوغاريتمي وخصائص جديدة. اختيار الخصائص يحذف المشوّش والمكرر.']],
  x:['Fit scalers and imputers on the training set only, then apply to validation and test.','درّبي المحجِّم والمعوِّض على بيانات التدريب فقط ثم طبّقيه على التحقق والاختبار.']},
 {t:['Splitting, leakage & class imbalance','تقسيم البيانات والتسريب وعدم التوازن'],p:[
  ['Train learns, validation tunes, test is touched once at the end. Think: practice, mock exam, real exam.','التدريب للتعلم، والتحقق للضبط، والاختبار يُستخدم مرة واحدة في النهاية. تخيّلي: تدريب ثم اختبار تجريبي ثم الاختبار الحقيقي.'],
  ['k-fold cross-validation gives a stable estimate on small datasets. Time-series: split by time, never shuffle.','التحقق المتقاطع k-fold يعطي تقديرًا مستقرًا للبيانات الصغيرة. السلاسل الزمنية: قسّمي حسب الزمن ولا تخلطي.'],
  ['Data leakage: information from outside training (future data, test data, or a feature that encodes the label) sneaks in. Results look great and fail in production.','تسريب البيانات: معلومات من خارج التدريب (بيانات مستقبلية أو الاختبار أو خاصية تكشف الهدف) تتسلل. النتائج ممتازة ثم تفشل في الإنتاج.'],
  ['Class imbalance: accuracy is misleading. Use resampling (SMOTE), class weights, a better threshold, and PR-AUC, recall, F1.','عدم توازن الفئات: الدقة مضللة. استخدمي إعادة العينة (SMOTE) وأوزان الفئات وضبط العتبة ومقاييس PR-AUC وrecall وF1.']],
  x:['Suspiciously perfect score means look for leakage first.','نتيجة مثالية بشكل مريب؟ ابحثي عن التسريب أولًا.']},
 {t:['Learning paradigms & classic algorithms','أنماط التعلم والخوارزميات الكلاسيكية'],p:[
  ['Supervised: labeled data (classification, regression). Unsupervised: no labels (clustering, dimensionality reduction like PCA). Reinforcement: agent learns from rewards.','الإشرافي: بيانات معنونة (تصنيف وانحدار). غير الإشرافي: بلا عناوين (تجميع وتقليل أبعاد مثل PCA). المعزز: وكيل يتعلم من المكافآت.'],
  ['Linear regression predicts numbers; logistic regression predicts class probability. Decision trees are interpretable.','الانحدار الخطي يتنبأ بأرقام، واللوجستي يتنبأ باحتمال فئة. أشجار القرار سهلة التفسير.'],
  ['Random Forest = many trees in parallel (bagging, lowers variance). Boosting (XGBoost) = trees in sequence, each fixing earlier errors (lowers bias). Often best on tabular data.','الغابة العشوائية = أشجار كثيرة بالتوازي (bagging يقلل التباين). التعزيز (XGBoost) = أشجار متتابعة تصلح أخطاء السابقة (يقلل الانحياز). غالبًا الأفضل للبيانات الجدولية.'],
  ['SVM finds the widest margin. KNN classifies by nearest neighbours (slow at prediction). Naive Bayes is fast, good for text. K-means groups data into k clusters.','SVM يبحث عن أوسع هامش. KNN يصنف بأقرب الجيران (بطيء عند التنبؤ). Naive Bayes سريع ومناسب للنص. K-means يجمّع البيانات في k مجموعة.']],
  x:['For tabular data, tree ensembles usually beat deep learning. Pick the simplest model that meets the requirement.','للبيانات الجدولية غالبًا تتفوق نماذج الأشجار على التعلم العميق. اختاري أبسط نموذج يحقق المطلوب.']},
 {t:['Bias-variance, regularization & tuning','الانحياز والتباين والتنظيم والضبط'],p:[
  ['Underfitting (high bias): poor on train AND validation. Fix: more capacity, better features, less regularization.','نقص التكيّف (انحياز عالٍ): سيئ على التدريب والتحقق معًا. الحل: نموذج أقوى وخصائص أفضل وتنظيم أقل.'],
  ['Overfitting (high variance): great on train, poor on validation. Fix: more data, regularization, simpler model, dropout, early stopping.','فرط التكيّف (تباين عالٍ): ممتاز على التدريب وضعيف على التحقق. الحل: بيانات أكثر وتنظيم ونموذج أبسط وdropout وإيقاف مبكر.'],
  ['L1 (Lasso) pushes weights to zero, so it selects features. L2 (Ridge) shrinks weights smoothly.','L1 (Lasso) تدفع الأوزان إلى الصفر فتختار الخصائص. L2 (Ridge) تقلّص الأوزان تدريجيًا.'],
  ['Gradient descent moves weights downhill on the loss. Learning rate too high: diverges. Too low: very slow. Tune hyperparameters (grid, random, Bayesian) on validation data.','الانحدار التدرجي يحرّك الأوزان نزولًا على دالة الخسارة. معدل تعلم عالٍ: يتباعد. منخفض: بطيء جدًا. اضبطي المعاملات الفائقة (grid وrandom وBayesian) على بيانات التحقق.']],
  x:['Compare train error and validation error first. That diagnoses the problem.','قارني خطأ التدريب بخطأ التحقق أولًا، فهذا يشخّص المشكلة.']},
 {t:['Evaluation metrics','مقاييس التقييم'],p:[
  ['Confusion matrix: TP, FP, TN, FN. Precision = TP/(TP+FP): of predicted positives, how many are right. Recall = TP/(TP+FN): of real positives, how many found. F1 = harmonic mean.','مصفوفة الالتباس: TP وFP وTN وFN. Precision = من المتوقع إيجابيًا كم صحيح. Recall = من الإيجابيين الحقيقيين كم اكتشفنا. F1 = المتوسط التوافقي.'],
  ['Missing a positive is costly (cancer, fraud): maximize recall. False alarms are costly (blocking legit email): maximize precision.','تفويت حالة إيجابية مكلف (سرطان، احتيال): ارفعي recall. الإنذار الكاذب مكلف (حجب بريد سليم): ارفعي precision.'],
  ['ROC-AUC is threshold-independent. With heavy imbalance prefer the Precision-Recall curve.','ROC-AUC لا يعتمد على العتبة. مع عدم التوازن الشديد فضّلي منحنى Precision-Recall.'],
  ['Regression: MAE (robust, same units), MSE/RMSE (punishes big errors), R². Clustering: silhouette score. Calibration: do predicted probabilities match reality?','الانحدار: MAE (متين وبنفس الوحدة) وMSE/RMSE (يعاقب الأخطاء الكبيرة) وR². التجميع: silhouette. المعايرة: هل الاحتمالات المتوقعة تطابق الواقع؟'],
  ['A/B testing compares two versions with a real traffic split. A result is significant if the p-value is below the chosen threshold (often 0.05). Nested CV gives an unbiased estimate when tuning and evaluating together.','اختبار A/B يقارن نسختين بتقسيم حركة حقيقية. النتيجة دالة إحصائيًا إن كانت p-value أقل من العتبة (غالبًا 0.05). التحقق المتداخل يعطي تقديرًا غير متحيز عند الضبط والتقييم معًا.']],
  x:['Always translate the business cost of FN vs FP into precision vs recall.','ترجمي دائمًا كلفة FN مقابل FP في الأعمال إلى precision مقابل recall.']}
]},
{id:'d2',n:'D2',w:16.7,en:'Core AI, Deep Learning & Generative AI',ar:'أساسيات الذكاء الاصطناعي والتعلم العميق والذكاء التوليدي',L:[
 {t:['Neural network basics','أساسيات الشبكات العصبية'],p:[
  ['A neuron = weighted sum + bias + activation. Layers stacked make a deep network (MLP).','العصبون = مجموع موزون + انحياز + دالة تفعيل. تكديس الطبقات يصنع شبكة عميقة (MLP).'],
  ['Activations: ReLU (default for hidden layers), sigmoid (binary output), softmax (multi-class output), tanh.','دوال التفعيل: ReLU (الافتراضي للطبقات المخفية) وsigmoid (مخرج ثنائي) وsoftmax (مخرج متعدد الفئات) وtanh.'],
  ['Backpropagation uses the chain rule to compute gradients of the loss for every weight. Loss: cross-entropy for classification, MSE for regression.','الانتشار العكسي يستخدم قاعدة السلسلة لحساب تدرجات الخسارة لكل وزن. الخسارة: cross-entropy للتصنيف وMSE للانحدار.'],
  ['Optimizers: SGD, Adam (adaptive, common default). Initialization (Xavier, He) keeps signals stable.','المحسّنات: SGD وAdam (تكيفي وشائع كافتراضي). تهيئة الأوزان (Xavier وHe) تحافظ على استقرار الإشارات.']],
  x:['Output layer decides activation: sigmoid = 2 classes, softmax = many classes, none = regression.','طبقة المخرجات تحدد التفعيل: sigmoid لفئتين، softmax لفئات متعددة، بلا تفعيل للانحدار.']},
 {t:['Training problems & regularization','مشاكل التدريب والتنظيم'],p:[
  ['Vanishing gradients: early layers stop learning (typical with sigmoid in deep nets). Fixes: ReLU, residual connections, batch norm, LSTM.','تلاشي التدرجات: الطبقات الأولى تتوقف عن التعلم (شائع مع sigmoid في الشبكات العميقة). الحلول: ReLU وروابط residual وbatch norm وLSTM.'],
  ['Exploding gradients: values blow up. Fix: gradient clipping, careful initialization.','انفجار التدرجات: القيم تتضخم. الحل: gradient clipping وتهيئة جيدة.'],
  ['Dropout randomly switches off neurons during training. Batch/Layer normalization stabilizes training. Early stopping halts when validation loss stops improving.','Dropout يطفئ عصبونات عشوائيًا أثناء التدريب. التطبيع (Batch/Layer) يثبّت التدريب. الإيقاف المبكر يوقف عند توقف تحسن خسارة التحقق.']],
  x:['Deep network that stops improving early in training: think vanishing gradients.','شبكة عميقة لا تتعلم طبقاتها الأولى: فكّري في تلاشي التدرجات.']},
 {t:['CNNs and RNNs','الشبكات الالتفافية والتكرارية'],p:[
  ['CNN: filters slide over an image to detect local patterns (edges, shapes) with shared weights. Pooling reduces size. Best for images.','CNN: مرشحات تنزلق على الصورة لاكتشاف أنماط محلية (حواف وأشكال) بأوزان مشتركة. التجميع (pooling) يقلل الحجم. الأفضل للصور.'],
  ['ResNet adds skip connections so very deep networks train well. VGG, Inception, EfficientNet are other vision families. Transfer learning reuses a pretrained model when you have little data.','ResNet يضيف skip connections لتدريب شبكات عميقة جدًا. VGG وInception وEfficientNet عائلات رؤية أخرى. التعلم بالنقل يعيد استخدام نموذج مدرّب عند قلة البيانات.'],
  ['RNN processes sequences step by step with memory. LSTM and GRU use gates to keep long-term memory. Limitation: sequential, slow, weak on very long text.','RNN يعالج التسلسلات خطوة بخطوة مع ذاكرة. LSTM وGRU تستخدم بوابات للذاكرة الطويلة. القيد: تسلسلي وبطيء وضعيف مع النصوص الطويلة جدًا.']],
  x:['Small image dataset: transfer learning from a pretrained CNN is the usual answer.','بيانات صور قليلة: التعلم بالنقل من CNN مدرّب مسبقًا هو الجواب المعتاد.']},
 {t:['Transformers & LLM mechanics','الترانسفورمر وآلية النماذج اللغوية'],p:[
  ['Self-attention lets every token look at every other token. Q (query), K (key), V (value): Q matches K to decide how much of V to take. Multi-head = several attention views in parallel.','الانتباه الذاتي يجعل كل رمز ينظر إلى كل الرموز. Q (استعلام) يطابق K (مفتاح) ليحدد كم يأخذ من V (قيمة). متعدد الرؤوس = عدة زوايا انتباه بالتوازي.'],
  ['Positional encoding is needed because attention alone ignores word order. Transformers train in parallel, which is why they replaced RNNs.','الترميز الموضعي ضروري لأن الانتباه وحده لا يعرف ترتيب الكلمات. الترانسفورمر يتدرب بالتوازي ولهذا حلّ محل RNN.'],
  ['Encoder-only (BERT): understanding, classification. Decoder-only (GPT): text generation. Encoder-decoder (T5): translation, summarization.','Encoder فقط (BERT): فهم وتصنيف. Decoder فقط (GPT): توليد نص. Encoder-decoder (T5): ترجمة وتلخيص.'],
  ['Tokenization splits text into subword tokens. Embeddings turn tokens into vectors. Context window = max tokens per request; attention cost grows quickly with length.','التقطيع (tokenization) يقسم النص إلى رموز فرعية. التضمينات تحوّل الرموز إلى متجهات. نافذة السياق = أقصى عدد رموز في الطلب، وتكلفة الانتباه تزيد بسرعة مع الطول.']],
  x:['“Understanding or classifying text” points to encoder models, “generating” points to decoder models.','“فهم أو تصنيف نص” يشير إلى encoder، و“توليد” يشير إلى decoder.']},
 {t:['Adapting LLMs: prompt, RAG, fine-tune','تكييف النماذج اللغوية: أوامر وRAG وضبط دقيق'],p:[
  ['Training stages: pre-training (general language), fine-tuning, instruction tuning (follow instructions), RLHF (align with human preferences).','مراحل التدريب: تدريب مسبق (لغة عامة) ثم ضبط دقيق ثم ضبط التعليمات ثم RLHF (مواءمة مع تفضيلات البشر).'],
  ['Prompt engineering is cheapest: clear instructions, few-shot examples, chain-of-thought. Try it first.','هندسة الأوامر أرخص حل: تعليمات واضحة وأمثلة few-shot وسلسلة تفكير. جرّبيها أولًا.'],
  ['RAG retrieves fresh or private documents and adds them to the prompt. Use it for up-to-date or company knowledge, and it reduces hallucination.','RAG يسترجع مستندات حديثة أو خاصة ويضيفها للأمر. استخدميه للمعرفة الحديثة أو الخاصة بالجهة، ويقلل الهلوسة.'],
  ['Fine-tuning changes behavior, style or format, not facts. PEFT/LoRA/QLoRA train only small adapters, so it is cheap and fits limited GPUs.','الضبط الدقيق يغيّر السلوك والأسلوب والصيغة وليس الحقائق. PEFT وLoRA وQLoRA تدرّب محوّلات صغيرة فقط، فهي رخيصة وتناسب GPU محدودة.']],
  x:['Decision order: prompt first, then RAG for knowledge, then fine-tune for behavior.','ترتيب القرار: الأوامر أولًا ثم RAG للمعرفة ثم الضبط الدقيق للسلوك.']},
 {t:['RAG details, generative families & evaluation','تفاصيل RAG وعائلات التوليد والتقييم'],p:[
  ['RAG pipeline: chunk documents, embed, store in a vector database (ANN search), retrieve top-k, generate the answer. Chunk size and overlap affect quality. Hybrid search = keyword + vector.','مسار RAG: تقطيع المستندات ثم تضمين ثم تخزين في قاعدة متجهية (بحث ANN) ثم استرجاع أفضل k ثم توليد الإجابة. حجم القطعة والتداخل يؤثران. البحث الهجين = كلمات + متجهات.'],
  ['GAN: generator vs discriminator (risk: mode collapse). VAE: learns a latent space. Diffusion: learns to remove noise step by step, very high image quality.','GAN: مولّد ضد مميّز (خطر: mode collapse). VAE: يتعلم فضاءً كامنًا. الانتشار: يتعلم إزالة الضوضاء خطوة بخطوة وجودة صور عالية.'],
  ['BLEU: translation. ROUGE: summarization. Perplexity: language model quality (lower is better).','BLEU: للترجمة. ROUGE: للتلخيص. Perplexity: لجودة النموذج اللغوي (الأقل أفضل).'],
  ['Hallucination = confident but wrong output. Reduce with RAG grounding, low temperature, guardrails, citations, human review.','الهلوسة = مخرج واثق لكنه خاطئ. تُقلَّل بـ RAG وحرارة منخفضة وضوابط ومراجع ومراجعة بشرية.']],
  x:['Answer must be grounded in company documents: RAG, not a bigger model.','الإجابة يجب أن تستند لمستندات الجهة: RAG وليس نموذجًا أكبر.']}
]},
{id:'d3',n:'D3',w:14.0,en:'AI Software Engineering & Integration',ar:'هندسة برمجيات الذكاء الاصطناعي والتكامل',L:[
 {t:['Code quality, Git & testing','جودة الكود وGit والاختبار'],p:[
  ['Clean, modular code: small functions, clear names, DRY, separation of concerns. Design patterns (factory, strategy, observer) solve common structure problems.','كود نظيف ومعياري: دوال صغيرة وأسماء واضحة وعدم التكرار وفصل المسؤوليات. أنماط التصميم (factory وstrategy وobserver) تحل مشاكل بنيوية شائعة.'],
  ['Git: feature branches, pull requests, code review before merging into main.','Git: فروع للميزات وطلبات دمج ومراجعة كود قبل الدمج في الفرع الرئيسي.'],
  ['Testing: unit tests (one function), integration tests (components together), model tests (data validation, minimum metric thresholds, regression against previous model).','الاختبار: وحدة (دالة واحدة) وتكامل (مكونات معًا) واختبارات النموذج (التحقق من البيانات وحدود دنيا للمقاييس ومقارنة بالنموذج السابق).'],
  ['Documentation and API contracts (OpenAPI) let teams integrate without guessing.','التوثيق وعقود الواجهات (OpenAPI) تتيح للفرق التكامل دون تخمين.']],
  x:['ML code needs data tests and model tests, not only unit tests.','كود ML يحتاج اختبارات للبيانات والنموذج وليس اختبارات الوحدة فقط.']},
 {t:['APIs and authentication','الواجهات والمصادقة'],p:[
  ['REST: resources + HTTP verbs, stateless, the common default. GraphQL: client asks exactly the fields it needs (fixes over/under-fetching). gRPC: binary Protobuf over HTTP/2, fast, typed, streaming, ideal for internal microservices.','REST: موارد وأفعال HTTP وبلا حالة، الخيار الشائع. GraphQL: العميل يطلب الحقول التي يريدها فقط (يحل الجلب الزائد/الناقص). gRPC: ثنائي Protobuf فوق HTTP/2 سريع ومحدد الأنواع ويدعم البث، مثالي للخدمات الداخلية.'],
  ['OAuth2 = delegated authorization (let an app access data without sharing the password). JWT = signed token carrying claims, stateless. API key = simple identification, not strong authentication.','OAuth2 = تفويض (يسمح لتطبيق بالوصول للبيانات دون مشاركة كلمة المرور). JWT = رمز موقّع يحمل بيانات بلا حالة. مفتاح API = تعريف بسيط وليس مصادقة قوية.'],
  ['Webhook = the server pushes an event to your URL when something happens, instead of you polling.','Webhook = الخادم يدفع حدثًا إلى رابطك عند وقوعه بدل أن تستعلمي باستمرار.']],
  x:['Match the need: flexible fields = GraphQL, low-latency internal = gRPC, public simple = REST.','طابقي الحاجة: حقول مرنة = GraphQL، داخلي منخفض الزمن = gRPC، عام وبسيط = REST.']},
 {t:['Messaging, microservices & caching','الرسائل والخدمات المصغّرة والتخزين المؤقت'],p:[
  ['Kafka: distributed event log, huge throughput, replay, streaming pipelines. RabbitMQ: message broker with routing and task queues.','Kafka: سجل أحداث موزع بإنتاجية هائلة وإعادة قراءة وللبث. RabbitMQ: وسيط رسائل بتوجيه وطوابير مهام.'],
  ['Microservices: small independently deployable services (scale and release separately) at the cost of complexity. Event-driven design decouples producers and consumers.','الخدمات المصغّرة: خدمات صغيرة تُنشر وتتوسع باستقلال مقابل تعقيد أكبر. المعمارية الموجهة بالأحداث تفصل المنتج عن المستهلك.'],
  ['Batch processing handles large data on a schedule. Streaming handles events in near real time.','المعالجة الدفعية تعالج بيانات كبيرة بجدول زمني. المتدفقة تعالج الأحداث شبه فوريًا.'],
  ['Caching cuts latency and cost for repeated requests. Hard part: invalidation (stale data).','التخزين المؤقت يقلل الزمن والتكلفة للطلبات المتكررة. الصعوبة: إبطال البيانات القديمة.']],
  x:['“Replay” or “high-volume stream” → Kafka. “Task queue / routing” → RabbitMQ.','“إعادة قراءة” أو “تدفق ضخم” ← Kafka. “طابور مهام/توجيه” ← RabbitMQ.']},
 {t:['Frameworks, serving & containers','الأطر والتقديم والحاويات'],p:[
  ['scikit-learn: classical ML. PyTorch: flexible, dominant in research. TensorFlow/Keras: strong production ecosystem. LangChain: orchestrates LLM apps (chains, agents, tools). LlamaIndex: indexing data for RAG.','scikit-learn: تعلم آلة كلاسيكي. PyTorch: مرن ومهيمن في الأبحاث. TensorFlow/Keras: منظومة إنتاج قوية. LangChain: لتنسيق تطبيقات LLM (سلاسل ووكلاء وأدوات). LlamaIndex: لفهرسة البيانات لـ RAG.'],
  ['Model serving: expose the model behind an API (FastAPI, TF Serving, TorchServe, Triton).','تقديم النموذج: إتاحته خلف واجهة API (FastAPI وTF Serving وTorchServe وTriton).'],
  ['Docker packages code + dependencies into a container, so it runs the same everywhere. Use virtual environments and pinned dependencies for reproducibility.','Docker يحزم الكود مع الاعتماديات في حاوية فتعمل بنفس الشكل في كل مكان. استخدمي بيئات افتراضية وإصدارات مثبتة لقابلية إعادة الإنتاج.']],
  x:['“Works on my machine” is solved by containers.','عبارة “يعمل على جهازي” حلّها الحاويات.']}
]},
{id:'d4',n:'D4',w:18.0,en:'MLOps, LLMOps, Deployment & Reliability',ar:'عمليات تعلم الآلة والنماذج اللغوية والنشر والموثوقية',star:true,L:[
 {t:['ML lifecycle, tracking & registry','دورة الحياة والتتبع والسجل'],p:[
  ['Lifecycle: problem, data, train, evaluate, deploy, monitor, retrain. It is a loop, not a line.','الدورة: مشكلة ثم بيانات ثم تدريب ثم تقييم ثم نشر ثم مراقبة ثم إعادة تدريب. إنها حلقة وليست خطًا.'],
  ['Experiment tracking (MLflow, Weights & Biases) records parameters, metrics and artifacts. Model registry stores versions and stages (staging, production, archived).','تتبع التجارب (MLflow وWeights & Biases) يسجل المعاملات والمقاييس والمخرجات. سجل النماذج يحفظ الإصدارات والمراحل (تجريبي وإنتاج وأرشيف).'],
  ['Feature store: one definition of features for training and serving, preventing training-serving skew.','مخزن الخصائص: تعريف واحد للخصائص للتدريب والتقديم، يمنع انحراف التدريب عن التقديم.'],
  ['Reproducibility = versioned code + data (DVC) + environment + config + random seed.','قابلية إعادة الإنتاج = كود + بيانات مُصدّرة (DVC) + بيئة + إعدادات + بذرة عشوائية.']],
  x:['Features computed differently offline and online: feature store.','خصائص تُحسب بشكل مختلف في التدريب والتقديم: مخزن الخصائص.']},
 {t:['CI/CD/CT & Infrastructure as Code','التكامل والنشر والتدريب المستمر والبنية ككود'],p:[
  ['CI: automatically build and test every change. CD: automatically deliver to environments. CT: continuous training, retrain when new data or drift arrives.','CI: بناء واختبار كل تغيير تلقائيًا. CD: تسليم تلقائي للبيئات. CT: تدريب مستمر عند وصول بيانات جديدة أو انجراف.'],
  ['Tools: GitHub Actions, GitLab CI, Jenkins for CI/CD; Airflow, Kubeflow for pipelines.','الأدوات: GitHub Actions وGitLab CI وJenkins للـ CI/CD؛ Airflow وKubeflow للمسارات.'],
  ['Infrastructure as Code (Terraform, CloudFormation): declare infrastructure in versioned files, repeatable and reviewable.','البنية التحتية ككود (Terraform وCloudFormation): تعريف البنية في ملفات مُصدّرة قابلة للتكرار والمراجعة.']],
  x:['Manual steps are the enemy: automate, version, repeat.','الخطوات اليدوية هي العدو: أتمتة وإصدارات وتكرار.']},
 {t:['Deployment strategies','استراتيجيات النشر'],p:[
  ['Blue-green: two identical environments, switch all traffic at once, instant rollback, double cost.','الأزرق-الأخضر: بيئتان متطابقتان، تحويل كل الحركة دفعة واحدة، تراجع فوري، تكلفة مضاعفة.'],
  ['Canary: send a small share (say 5%) of real traffic to the new version, grow if healthy. Limits blast radius.','Canary: توجيه نسبة صغيرة (مثل 5%) من الحركة الحقيقية للإصدار الجديد ثم التوسع إن كان سليمًا. يحدّ من أثر الخطأ.'],
  ['Shadow: new model receives a copy of live traffic but its outputs are hidden. Zero user risk, used to validate.','Shadow: النموذج الجديد يستقبل نسخة من الحركة الحية لكن مخرجاته مخفية. بلا خطر على المستخدم، للتحقق.'],
  ['A/B test: split users between versions to compare a business metric. Rolling update: replace instances gradually.','اختبار A/B: تقسيم المستخدمين بين نسختين لمقارنة مؤشر أعمال. التحديث المتدرج: استبدال النسخ تدريجيًا.'],
  ['Batch inference: scheduled, high volume, no latency need. Online inference: real time per request. Edge: on-device for privacy, offline use, low latency.','الاستدلال الدفعي: مجدول وحجم كبير بلا حاجة لزمن قصير. الفوري: لحظي لكل طلب. الحافة: على الجهاز للخصوصية والعمل دون اتصال وزمن منخفض.']],
  x:['No user impact allowed → shadow. Limit risk gradually → canary. Instant switch back → blue-green.','ممنوع أي أثر على المستخدم ← shadow. تقليل المخاطرة تدريجيًا ← canary. رجوع فوري ← blue-green.']},
 {t:['Monitoring, drift & reliability','المراقبة والانجراف والموثوقية'],p:[
  ['Data drift: input distribution changes. Concept drift: the relationship between inputs and target changes (same inputs, different meaning). Detect with PSI, KS test, monitoring metrics.','انجراف البيانات: توزيع المدخلات يتغير. انجراف المفهوم: العلاقة بين المدخلات والهدف تتغير (نفس المدخلات بمعنى مختلف). يُكتشف بـ PSI واختبار KS ومراقبة المقاييس.'],
  ['Operational metrics: latency (p95/p99), throughput, error rate. Logging and alerting turn problems into actions. Automated retraining can be triggered by drift or schedule.','مقاييس التشغيل: زمن الاستجابة (p95/p99) والإنتاجية ومعدل الأخطاء. التسجيل والتنبيه يحوّلان المشاكل إلى إجراءات. إعادة التدريب الآلية تُطلق بالانجراف أو بجدول.'],
  ['SLI = what you measure. SLO = internal target for it (99.9% uptime). SLA = contract with consequences.','SLI = ما تقيسينه. SLO = الهدف الداخلي له (توافر 99.9%). SLA = عقد له عواقب.'],
  ['High availability: redundancy and multiple zones. Fault tolerance: keep working during failures. Rollback: return quickly to the last good version.','التوافر العالي: تكرار ومناطق متعددة. تحمل الأعطال: الاستمرار أثناء الفشل. التراجع: العودة سريعًا لآخر إصدار سليم.']],
  x:['Accuracy drops after the world changed with the same inputs: concept drift, so retrain.','تراجع الدقة بعد تغير الواقع مع نفس المدخلات: انجراف مفهوم، فأعيدي التدريب.']},
 {t:['LLMOps & model optimization','LLMOps وتحسين النماذج'],p:[
  ['Version prompts like code. Evaluate LLMs with golden datasets, LLM-as-judge and human review. Guardrails filter unsafe inputs and outputs.','أصدري الأوامر كالكود. قيّمي النماذج اللغوية بمجموعات ذهبية وLLM-as-judge ومراجعة بشرية. الضوابط (guardrails) تفلتر المدخلات والمخرجات غير الآمنة.'],
  ['Cost levers: shorter prompts, response and semantic caching, routing easy queries to smaller models, batching.','أدوات خفض التكلفة: أوامر أقصر وتخزين الإجابات (دلالي أيضًا) وتوجيه الأسئلة السهلة لنماذج أصغر ودفعات.'],
  ['Quantization: lower numeric precision (FP16, INT8, INT4) → smaller and faster, slight accuracy loss. Pruning: remove unimportant weights. Distillation: a small student learns from a large teacher.','التكميم: دقة رقمية أقل (FP16 وINT8 وINT4) ← أصغر وأسرع مع خسارة بسيطة. التقليم: حذف الأوزان غير المهمة. التقطير: طالب صغير يتعلم من معلم كبير.']],
  x:['Need smaller/faster with minimal retraining: quantization. Want a compact model that imitates a big one: distillation.','تريدين أصغر وأسرع دون إعادة تدريب كبيرة: تكميم. تريدين نموذجًا صغيرًا يقلّد كبيرًا: تقطير.']}
]},
{id:'d5',n:'D5',w:12.6,en:'Architecture, Infrastructure, Performance & Scalability',ar:'المعمارية والبنية التحتية والأداء وقابلية التوسع',L:[
 {t:['Platforms and where to run','المنصات ومكان التشغيل'],p:[
  ['Managed ML platforms: AWS SageMaker, Azure ML, Google Vertex AI. They bundle training, registry, deployment and monitoring.','منصات ML مُدارة: AWS SageMaker وAzure ML وGoogle Vertex AI. تجمع التدريب والسجل والنشر والمراقبة.'],
  ['On-premises: maximum control and data residency, high upfront cost. Cloud: elastic, pay-as-you-go. Hybrid: sensitive data local, bursts in the cloud.','محلي: تحكم أقصى وإقامة بيانات، وتكلفة مبدئية عالية. سحابي: مرن ودفع حسب الاستخدام. هجين: البيانات الحساسة محليًا والذروة في السحابة.'],
  ['Data residency or regulation (for example Saudi personal data rules) can force local or in-country hosting.','إقامة البيانات أو اللوائح (مثل أنظمة البيانات الشخصية السعودية) قد تفرض استضافة محلية أو داخل المملكة.']],
  x:['Regulatory or sovereignty constraint is usually the deciding clue.','قيد تنظيمي أو سيادة بيانات غالبًا هو القيد الحاسم.']},
 {t:['Compute and distributed training','الحوسبة والتدريب الموزع'],p:[
  ['GPU: general parallel hardware (CUDA), flexible. TPU: Google accelerator specialized for tensor math, large-scale training in Google Cloud.','GPU: عتاد متوازٍ عام (CUDA) ومرن. TPU: مسرّع من Google متخصص بالحسابات التنسورية للتدريب الكبير في Google Cloud.'],
  ['Data parallelism: copy the model on many devices, split the data. Model parallelism: split the model itself when it does not fit in one device. Pipeline parallelism: split by layer stages.','توازي البيانات: نسخ النموذج على أجهزة وتقسيم البيانات. توازي النموذج: تقسيم النموذج نفسه إذا لم يتسع في جهاز. توازي المسار: تقسيم حسب مراحل الطبقات.'],
  ['Mixed precision (FP16/BF16) speeds training and saves memory.','الدقة المختلطة (FP16/BF16) تسرّع التدريب وتوفر الذاكرة.']],
  x:['Data too big: data parallel. Model too big: model parallel.','البيانات كبيرة: data parallel. النموذج كبير: model parallel.']},
 {t:['Scaling, latency, Kubernetes & serverless','التوسع والزمن وKubernetes وبلا خوادم'],p:[
  ['Vertical scaling: bigger machine (has a ceiling, single point of failure). Horizontal scaling: more machines behind a load balancer (needs stateless services).','التوسع الرأسي: جهاز أقوى (له سقف ونقطة فشل وحيدة). الأفقي: أجهزة أكثر خلف موزّع أحمال (يتطلب خدمات بلا حالة).'],
  ['Auto-scaling adds or removes instances from metrics such as CPU or queue length. Watch cold starts.','التوسع التلقائي يضيف أو يزيل نسخًا حسب مقاييس مثل المعالج أو طول الطابور. انتبهي للبدء البارد.'],
  ['Cut latency with: caching, request batching, quantization, smaller models, GPU inference, edge/CDN, model compilation.','لتقليل الزمن: تخزين مؤقت ودفعات طلبات وتكميم ونماذج أصغر واستدلال GPU وحافة/CDN وتحويل النموذج.'],
  ['Kubernetes orchestrates containers: scheduling, scaling, self-healing. Serverless: pay per invocation, scales to zero, good for spiky light workloads, limited by time and cold starts.','Kubernetes ينسق الحاويات: جدولة وتوسع وإصلاح ذاتي. Serverless: دفع لكل استدعاء ويتوسع حتى الصفر، مناسب للأحمال الخفيفة المتقطعة، بقيود الزمن والبدء البارد.']],
  x:['Unpredictable spiky light traffic: serverless. Steady heavy GPU inference: Kubernetes with autoscaling.','حركة خفيفة متقطعة لا يمكن توقعها: serverless. استدلال GPU ثقيل ومستمر: Kubernetes مع توسع تلقائي.']},
 {t:['Data architecture & disaster recovery','معمارية البيانات والتعافي من الكوارث'],p:[
  ['ETL: transform before loading (warehouse). ELT: load raw first, transform inside the platform (modern cloud).','ETL: تحويل قبل التحميل (مستودع). ELT: تحميل الخام أولًا ثم التحويل داخل المنصة (السحابة الحديثة).'],
  ['Data lake: cheap raw storage, schema-on-read. Warehouse: curated structured data for BI, schema-on-write. Lakehouse: both in one.','بحيرة بيانات: تخزين خام رخيص وschema-on-read. مستودع: بيانات منظمة منسقة للتحليل وschema-on-write. Lakehouse: الاثنان معًا.'],
  ['Disaster recovery: RPO = how much data loss is acceptable. RTO = how long downtime is acceptable. Backups, replication and multi-region meet them.','التعافي من الكوارث: RPO = كمية البيانات المسموح فقدها. RTO = مدة التوقف المسموحة. النسخ الاحتياطي والتكرار وتعدد المناطق تحقق ذلك.'],
  ['End-to-end design: ingest → store → train → registry → serve → monitor → retrain.','تصميم شامل: استيعاب ثم تخزين ثم تدريب ثم سجل ثم تقديم ثم مراقبة ثم إعادة تدريب.']],
  x:['RPO is about data, RTO is about time.','RPO عن البيانات، وRTO عن الوقت.']},
 {t:['Capacity, latency and cost math (exam pattern)','حسابات السعة والزمن والتكلفة (نمط في الاختبار)'],p:[
  ['Requirements matching: write the hard limits first (p95 latency, budget, peak load, data location, explainability). Cross out every option that fails any one of them. Among the rest, take the best on the target metric at the lowest cost.','مطابقة المتطلبات: اكتبي القيود الصارمة أولًا (زمن p95 والميزانية والحمل الأقصى وموقع البيانات وقابلية التفسير). اشطبي كل خيار يخالف واحدًا منها. من الباقي اختاري الأفضل في المقياس المستهدف بأقل تكلفة.'],
  ['Batching trades latency for throughput. Pick the largest batch size whose p95 latency still meets the SLO, then size replicas: replicas = peak req/s ÷ throughput per replica, rounded up with headroom.','الدفعات تبادل الزمن بالإنتاجية. اختاري أكبر حجم دفعة يبقى معه زمن p95 ضمن الهدف، ثم احسبي النسخ: عدد النسخ = الحمل الأقصى ÷ إنتاجية النسخة الواحدة، مقرّبًا للأعلى مع هامش أمان.'],
  ['GPU memory for LLM serving is additive: weights + runtime allocations + KV cache per session × concurrent sessions + operating reserve. If the total exceeds the card, cut concurrency or sequence length, quantize, or add memory.','ذاكرة GPU لخدمة النماذج اللغوية تُجمع: الأوزان + مخصصات التشغيل + KV cache لكل جلسة × عدد الجلسات + احتياطي تشغيلي. إن زاد المجموع عن الكرت: قلّلي التزامن أو طول التسلسل أو كمّمي أو زيدي الذاكرة.'],
  ['Cost review: find waste (idle GPUs, oversized instances, repeated identical calls, long prompts), then reduce with right-sizing, autoscaling, caching, smaller models for easy traffic, reserved capacity for steady load.','مراجعة التكلفة: ابحثي عن الهدر (GPU خاملة ونسخ أكبر من اللازم واستدعاءات مكررة وأوامر طويلة)، ثم قلّليه بتحجيم مناسب وتوسع تلقائي وتخزين مؤقت ونماذج أصغر للحركة السهلة وسعة محجوزة للحمل الثابت.']],
  x:['A fancier option that fails one hard requirement is always wrong, even with the best accuracy.','خيار يفشل في متطلب صارم واحد يكون خاطئًا دائمًا، حتى لو كانت دقته الأعلى.']}
]},
{id:'d6',n:'D6',w:14.7,en:'Responsible AI, Security & Governance',ar:'الذكاء الاصطناعي المسؤول والأمن والحوكمة',L:[
 {t:['Bias and fairness','التحيز والعدالة'],p:[
  ['Bias sources: historical, sampling, measurement, representation, label bias. A model can copy and amplify bias in the data.','مصادر التحيز: تاريخي وعينة وقياس وتمثيل وتحيز التسمية. النموذج قد ينسخ تحيز البيانات ويضخمه.'],
  ['Fairness metrics: demographic parity (equal positive rate across groups), equal opportunity (equal recall), equalized odds (equal TPR and FPR). They can conflict, so choose by context.','مقاييس العدالة: demographic parity (نسبة إيجابية متساوية بين المجموعات) وequal opportunity (recall متساوٍ) وequalized odds (TPR وFPR متساويان). قد تتعارض، فاختاري حسب السياق.'],
  ['Mitigate before training (rebalance data), during (fairness constraints), or after (adjust thresholds). Keep a human in the loop for high-stakes decisions.','العلاج قبل التدريب (إعادة موازنة البيانات) أو أثناءه (قيود عدالة) أو بعده (تعديل العتبات). أبقي إنسانًا في الحلقة للقرارات عالية الخطورة.']],
  x:['Do not just remove the sensitive column: proxies (like postcode) leak it.','لا يكفي حذف العمود الحساس، فالبدائل (مثل الرمز البريدي) تسرّبه.']},
 {t:['Explainability and documentation','قابلية التفسير والتوثيق'],p:[
  ['SHAP: Shapley-value contribution of each feature, global and per-prediction. LIME: local surrogate model around one prediction.','SHAP: مساهمة كل خاصية بقيم Shapley عالميًا ولكل تنبؤ. LIME: نموذج بديل محلي حول تنبؤ واحد.'],
  ['Model card: intended use, limits, metrics, risks. Datasheet: how a dataset was collected and its limits. Audit trails: who did what and when.','بطاقة النموذج: الاستخدام المقصود والحدود والمقاييس والمخاطر. صحيفة البيانات: كيف جُمعت البيانات وحدودها. سجلات التدقيق: من فعل ماذا ومتى.'],
  ['Regulated or high-impact decisions need explanations a person can understand.','القرارات المنظمة أو عالية الأثر تحتاج تفسيرات يفهمها الإنسان.']],
  x:['“Explain one decision to a customer or regulator” → SHAP or LIME.','“اشرحي قرارًا واحدًا لعميل أو جهة تنظيمية” ← SHAP أو LIME.']},
 {t:['AI security threats','تهديدات أمن الذكاء الاصطناعي'],p:[
  ['Adversarial examples: tiny crafted changes to inputs at inference cause wrong output. Data poisoning: corrupt training data. Model extraction: steal a model by querying it. Model inversion / membership inference: leak training data.','أمثلة عدائية: تغييرات صغيرة مصممة للمدخلات وقت الاستدلال تسبب خطأ. تسميم البيانات: إفساد بيانات التدريب. استخلاص النموذج: سرقته بالاستعلام. عكس النموذج/استدلال العضوية: تسريب بيانات التدريب.'],
  ['Prompt injection: instructions hidden in user input (direct) or in retrieved documents and web pages (indirect) hijack the LLM.','حقن الأوامر: تعليمات مخفية في مدخل المستخدم (مباشر) أو في مستندات وصفحات مسترجعة (غير مباشر) تختطف النموذج.'],
  ['Defenses: input validation, least-privilege tools, output filtering, guardrails, treat retrieved text as untrusted, human approval for risky actions, rate limiting, adversarial training.','الدفاعات: تحقق من المدخلات وأقل صلاحيات للأدوات وفلترة المخرجات وضوابط واعتبار النص المسترجع غير موثوق وموافقة بشرية للإجراءات الخطرة وتحديد المعدل وتدريب عدائي.']],
  x:['Training time attack = poisoning. Inference time attack = adversarial example.','هجوم وقت التدريب = تسميم. هجوم وقت الاستدلال = مثال عدائي.']},
 {t:['Privacy-preserving techniques','تقنيات حفظ الخصوصية'],p:[
  ['Differential privacy: add calibrated noise so no single person changes the result much (epsilon controls the trade-off).','الخصوصية التفاضلية: إضافة ضوضاء معايرة بحيث لا يغيّر فرد واحد النتيجة كثيرًا (epsilon تضبط المفاضلة).'],
  ['Federated learning: train where the data lives and share only model updates, not raw data.','التعلم الاتحادي: التدريب حيث توجد البيانات ومشاركة تحديثات النموذج فقط لا البيانات الخام.'],
  ['Homomorphic encryption: compute on encrypted data. Also: anonymization, pseudonymization, data minimization.','التشفير المتماثل: حسابات على بيانات مشفرة. وأيضًا: إخفاء الهوية والأسماء المستعارة وتقليل البيانات.']],
  x:['Several hospitals, cannot share records: federated learning.','عدة مستشفيات لا يمكنها مشاركة السجلات: تعلم اتحادي.']},
 {t:['Governance, standards & regulation','الحوكمة والمعايير واللوائح'],p:[
  ['NIST AI RMF has four functions: Govern, Map, Measure, Manage. ISO/IEC 42001 is a certifiable AI management system standard.','إطار NIST لإدارة مخاطر الذكاء الاصطناعي له أربع وظائف: Govern وMap وMeasure وManage. ISO/IEC 42001 معيار نظام إدارة ذكاء اصطناعي قابل للاعتماد.'],
  ['GDPR: consent, minimization, erasure, transparency. EU AI Act: risk tiers (unacceptable, high, limited, minimal).','GDPR: موافقة وتقليل بيانات ومحو وشفافية. قانون الذكاء الاصطناعي الأوروبي: مستويات مخاطر (غير مقبول وعالٍ ومحدود ودنيا).'],
  ['Saudi context: SDAIA AI Ethics Principles (fairness, privacy and security, humanity, social and environmental benefit, reliability and safety, transparency and explainability, accountability) and the Personal Data Protection Law (PDPL). Verify details on official SDAIA pages.','السياق السعودي: مبادئ أخلاقيات الذكاء الاصطناعي من سدايا (العدالة والخصوصية والأمن والإنسانية والمنافع الاجتماعية والبيئية والموثوقية والسلامة والشفافية وقابلية التفسير والمساءلة) ونظام حماية البيانات الشخصية (PDPL). تحققي من التفاصيل في صفحات سدايا الرسمية.'],
  ['AI Ethics Principles define four lifecycle phases in this order: Plan and Design, Prepare Input Data, Build and Validate, Deploy and Monitor. The developer builds systems using data and algorithms; the owner applies or uses systems to achieve goals.','مبادئ أخلاقيات الذكاء الاصطناعي تحدد أربع مراحل لدورة حياة النظام بهذا الترتيب: Plan and Design ثم Prepare Input Data ثم Build and Validate ثم Deploy and Monitor. المطوّر يبني الأنظمة باستخدام البيانات والخوارزميات، والمالك يطبّق الأنظمة أو يستخدمها لتحقيق أهدافه.'],
  ['Data governance: ownership, lineage, quality rules, access control. AI risk management: identify, assess, treat, monitor.','حوكمة البيانات: ملكية وتتبع المصدر وقواعد جودة وتحكم بالوصول. إدارة مخاطر الذكاء الاصطناعي: تحديد وتقييم ومعالجة ومراقبة.']],
  x:['Governance questions reward the answer that is documented, accountable and proportional to risk. Option names are close, so learn the official names word for word (see the exam strategy tab).','أسئلة الحوكمة تكافئ الإجابة الموثقة والتي فيها مساءلة وتتناسب مع مستوى الخطر. الخيارات متقاربة فاحفظي الأسماء الرسمية بالنص (انظري تبويب الاستراتيجية).']}
]},
{id:'d7',n:'D7',w:6.7,en:'Business, Professional Practice & Collaboration',ar:'الأعمال والممارسة المهنية والتعاون',L:[
 {t:['Problem framing, ROI & KPIs','تأطير المشكلة والعائد والمؤشرات'],p:[
  ['Start from the business problem, not the model. Ask whether AI is needed at all; try a simple rule or baseline first.','ابدئي من مشكلة العمل وليس النموذج. اسألي هل نحتاج الذكاء الاصطناعي أصلًا؛ جرّبي قاعدة بسيطة أو خط أساس أولًا.'],
  ['Separate model metrics (F1, RMSE) from business KPIs (cost saved, churn reduced). A model is only successful if the business KPI moves.','فرّقي بين مقاييس النموذج (F1 وRMSE) ومؤشرات الأعمال (تكلفة موفرة وتسرب أقل). النموذج ناجح فقط إذا تحرك مؤشر الأعمال.'],
  ['ROI = (benefit − cost) / cost. Count full cost: data, people, infrastructure, maintenance, monitoring.','ROI = (المنفعة − التكلفة) / التكلفة. احسبي كامل التكلفة: بيانات وأفراد وبنية وصيانة ومراقبة.']],
  x:['When the scenario shows a business gap, pick the answer that aligns the work with the KPI.','عندما يُظهر السيناريو فجوة في الأعمال، اختاري ما يربط العمل بمؤشر الأداء.']},
 {t:['Methodologies and stakeholders','المنهجيات وأصحاب المصلحة'],p:[
  ['Agile/Scrum: short sprints and iteration. Kanban: visual flow with work-in-progress limits. CRISP-DM: business understanding, data understanding, data preparation, modeling, evaluation, deployment.','أجايل/سكرام: سبرنتات قصيرة وتكرار. كانبان: تدفق مرئي مع حدود للعمل الجاري. CRISP-DM: فهم الأعمال ثم فهم البيانات ثم تجهيزها ثم النمذجة ثم التقييم ثم النشر.'],
  ['Manage expectations: explain uncertainty, trade-offs and limits. Never promise 100% accuracy.','أديري التوقعات: اشرحي عدم اليقين والمفاضلات والحدود. لا تعدي بدقة 100%.']],
  x:['CRISP-DM always starts with business understanding.','CRISP-DM يبدأ دائمًا بفهم الأعمال.']},
 {t:['Communication, ethics & collaboration','التواصل والأخلاقيات والتعاون'],p:[
  ['Technical communication: speak in the audience’s language, lead with the decision and the impact, use visuals (data storytelling).','التواصل التقني: خاطبي الجمهور بلغته وابدئي بالقرار والأثر واستخدمي المرئيات (سرد القصص بالبيانات).'],
  ['Professional ethics: honesty about limitations, disclose discovered bias or risk, protect privacy, do not take shortcuts that harm people.','الأخلاقيات المهنية: صدق بشأن القيود، والإفصاح عن أي تحيز أو خطر مكتشف، وحماية الخصوصية، وعدم اختصار الطريق بما يضر الناس.'],
  ['Cross-functional work: data engineers, product, legal, security, domain experts. Share knowledge with docs, reviews and blameless post-mortems.','العمل متعدد التخصصات: مهندسو بيانات ومنتج وقانون وأمن وخبراء مجال. شاركي المعرفة بالتوثيق والمراجعات وتحليل الحوادث بلا لوم.']],
  x:['Ethics scenarios: the right answer discloses and mitigates, it never hides to meet a deadline.','سيناريوهات الأخلاقيات: الإجابة الصحيحة تُفصح وتعالج ولا تُخفي من أجل موعد.']}
]}
];


var PRIMER=[
 ['AI, ML, DL, GenAI: what is the difference?','الذكاء الاصطناعي وتعلم الآلة والتعلم العميق والتوليدي: ما الفرق؟',
  ['AI is the big field: machines doing tasks that need intelligence. Machine Learning (ML) is a way to do AI by learning patterns from data instead of writing rules. Deep Learning (DL) is ML with many-layer neural networks. Generative AI creates new content (text, images, code).','الذكاء الاصطناعي هو المجال الكبير: آلات تؤدي مهام تحتاج ذكاءً. تعلم الآلة طريقة لتحقيقه بتعلم الأنماط من البيانات بدل كتابة القواعد. التعلم العميق تعلم آلة بشبكات عصبية متعددة الطبقات. الذكاء التوليدي ينتج محتوى جديدًا (نص وصور وكود).']],
 ['Data, features, labels, model','البيانات والخصائص والهدف والنموذج',
  ['Imagine predicting house prices. Features are the inputs (area, rooms, city). The label is the answer (price). The model is the formula it learns. Training = learning from examples. Inference = using the trained model on new houses.','تخيّلي التنبؤ بسعر بيت. الخصائص (features) هي المدخلات (المساحة والغرف والمدينة). الهدف (label) هو الجواب (السعر). النموذج هو الصيغة التي يتعلمها. التدريب = التعلم من أمثلة. الاستدلال = استخدام النموذج المدرّب على بيوت جديدة.']],
